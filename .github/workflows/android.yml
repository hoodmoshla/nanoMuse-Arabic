name: Android

# A debug APK (arm64-v8a) for every push and pull request that touches the
# Android tree. Debug-signed only: no keystore and no secrets are involved;
# release builds happen on a developer machine with scripts/release-apk.sh.

on:
  push:
    branches: [main, codex/arabic-standalone-phase2]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  NDK_VERSION: 27.2.12479018

jobs:
  # The path filter is a job, not `on.push.paths`, so the build is reported as skipped rather
  # than absent when the Android tree is untouched: branch protection requires this check,
  # and a check that never reports would block every docs-only pull request.
  changes:
    name: what changed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            android:
              - "android/**"
              - "scripts/android/**"
              - "scripts/rebrand.py"
              - "scripts/gen-android-icons.py"
              - ".github/workflows/android.yml"

  debug-apk:
    name: debug APK · arm64-v8a
    needs: changes
    if: needs.changes.outputs.android == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive # android/deps/proot (our fork)

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # gomobile@latest wants the current Go; GOTOOLCHAIN=auto below lets `go` fetch a
          # newer one when it asks for it (setup-go v6+ pins the toolchain otherwise).
          go-version: "1.26"
          cache-dependency-path: android/deps/rclone-mobile/go.sum

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platforms;android-36 build-tools;35.0.0 cmake;3.22.1 ndk;${{ env.NDK_VERSION }}

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # nanoMuse-Arabic: the Arabic resources, before the half hour of native building. A key
      # that went missing from values-ar/strings.xml, a placeholder that drifted out of a
      # translation, a Persian letter from the wrong keyboard — fifteen seconds here beats
      # discovering it on a phone. python3 is on the runner and the checker is stdlib-only;
      # tests/test_arabic_resources.py covers the checker itself in the Python job.
      - name: Arabic resources
        run: python3 scripts/check-arabic-resources.py

      - name: Native artifacts (proot, Alpine rootfs, rclone.aar)
        env:
          GOTOOLCHAIN: auto
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          export GOROOT="$(go env GOROOT)" GOPATH="$(go env GOPATH)"
          export PATH="$GOPATH/bin:$PATH" # gomobile / gobind land there
          bash scripts/android/build-natives.sh

      # Gradle reads `rclone.aar` out of `app/libs` while it resolves the module's classpath — at
      # configuration time, before a line of Kotlin is compiled. A missing .aar is therefore not a
      # compile error: it is "Could not find :rclone:. Searched in: .../app/libs/rclone.aar", with
      # no Kotlin in the message and no hint that a build step had to run first. Every path here is
      # one `scripts/android/build-natives.sh` is supposed to have written; naming the missing one
      # is the difference between a five-second diagnosis and an afternoon.
      - name: The files Gradle will ask for
        run: |
          set -euo pipefail
          missing=""
          for f in \
            android/src/android/app/libs/rclone.aar \
            android/src/android/app/src/main/assets/proot-aarch64 \
            android/src/android/app/src/main/assets/alpine-minirootfs.tar.gz \
            android/src/android/app/src/main/jniLibs/arm64-v8a/libproot-loader.so \
            android/src/android/app/src/main/jniLibs/arm64-v8a/libproot-loader32.so
          do
            if [ -s "$f" ]; then
              printf 'ok    %6s  %s\n' "$(du -h "$f" | cut -f1)" "$f"
            else
              printf 'MISSING        %s\n' "$f"
              missing="$missing $f"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::scripts/android/build-natives.sh did not produce:$missing"
            echo "rclone.aar is consumed as a flatDir dependency of :app, so Gradle fails on it"
            echo "before compiling anything. The natives step has to run first, and to succeed."
            exit 1
          fi

      # Every Kotlin source, both source sets. Gradle's own message for a Kotlin failure is the
      # six words "Compilation error. See log for more details" with the file and line in the
      # compiler's output far above it, so compiling here — after the natives, before the APK —
      # puts that error in the summary in three minutes instead of after the packaging, and
      # checks the unit-test sources too, which `assembleDebug` never compiles.
      - name: Kotlin compiles
        working-directory: android/src/android
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          ./gradlew :app:compileDebugKotlin :app:compileDebugUnitTestKotlin --console=plain --no-daemon

      - name: assembleDebug
        working-directory: android/src/android
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          ./gradlew :app:assembleDebug --console=plain --no-daemon

      # Our unit tests (io.github.nanomuse.*: the guards, the hub client, the sandbox paths, the
      # strings' parity), plus the upstream provider and sandbox tests, the two OpenMinis packages
      # our edits touch (#333, #334, #335). Same Gradle invocation as AGENTS.md; the compiled
      # classes are warm.
      - name: Unit tests
        working-directory: android/src/android
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          ./gradlew :app:testDebugUnitTest --tests 'io.github.nanomuse.*' \
            --tests 'com.openminis.app.provider.*' --tests 'com.openminis.app.sandbox.*' \
            --console=plain --no-daemon

      # The on-device tests cannot run here (no emulator), but the source set must keep
      # compiling or io.github.nanomuse.reach.ReachHubInstrumentedTest never runs anywhere (#332).
      - name: androidTest compiles
        working-directory: android/src/android
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          ./gradlew :app:compileDebugAndroidTestKotlin --console=plain --no-daemon

      # Gradle's own message for a test failure names the HTML report and nothing else, and that
      # report is an artifact somebody has to download and open. The XML Gradle wrote beside it has
      # the class, the test, the message and the stack; this prints them into the log, where the
      # failure is read the first time. `if: always()` because this is the step that matters most
      # when the one above failed.
      - name: Which tests failed
        if: always()
        run: |
          set -euo pipefail
          dir=android/src/android/app/build/test-results/testDebugUnitTest
          if [ ! -d "$dir" ]; then
            echo "no test results yet at $dir"
            exit 0
          fi
          python3 - "$dir" <<'PY'
          import pathlib, sys, xml.etree.ElementTree as ET
          directory = pathlib.Path(sys.argv[1])
          files = sorted(directory.glob("*.xml"))
          total = failures = errors = skipped = 0
          bad = []
          for f in files:
              try:
                  root = ET.parse(f).getroot()
              except ET.ParseError as exc:
                  print(f"{f.name}: unreadable ({exc})")
                  continue
              total += int(root.get("tests", 0))
              failures += int(root.get("failures", 0))
              errors += int(root.get("errors", 0))
              skipped += int(root.get("skipped", 0))
              for case in root.iter("testcase"):
                  for kind in ("failure", "error"):
                      node = case.find(kind)
                      if node is None:
                          continue
                      bad.append((case.get("classname"), case.get("name"), node.get("message"), (node.text or "").strip()))
          print(f"{len(files)} class file(s), {total} test(s): {failures} failed, {errors} errored, {skipped} skipped")
          for cls, name, message, stack in bad:
              print("::error::" + f"{cls}.{name}: {(message or '').splitlines()[0][:300]}")
              print(f"\n--- {cls}.{name}")
              print(f"    {(message or '').splitlines()[0][:400] if message else '(no message)'}")
              for line in stack.splitlines()[:12]:
                  print("    " + line)
              print()
          if bad:
              sys.exit(1)
          PY

      - name: Badging
        run: |
          bt="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$bt/aapt" dump badging android/src/android/app/build/outputs/apk/debug/app-debug.apk | grep -E "^package:|application-label:|native-code"

      # nanoMuse-Arabic: the unit-test report, kept even when the tests are what failed — that
      # is the run whose report is worth having. `if-no-files-found: warn` because a build that
      # fell over before the tests ran has nothing to upload, which is not a second failure.
      # Kept whether or not the tests passed, and that is the whole point: the XML beside the HTML
      # is what says which test failed and why, and it is written even when the run dies.
      - name: Unit test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nanoMuse-Arabic-android-test-report
          path: |
            android/src/android/app/build/reports/tests/
            android/src/android/app/build/test-results/
          retention-days: 14
          if-no-files-found: warn

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nanoMuse-Arabic-debug-apk
          path: android/src/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
